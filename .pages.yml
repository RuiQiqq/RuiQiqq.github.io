# CMS CONFIG VERSION: GAME-HISTORY-V49
# V49: homepage/full-page editable game experience copy exposed at the top of Pages CMS.
media:
- name: images
  label: 图片／GIF
  input: assets/images
  output: /assets/images
  extensions:
  - png
  - jpg
  - jpeg
  - webp
  - gif
  rename: safe
- name: videos
  label: 本地短视频
  input: assets/videos
  output: /assets/videos
  extensions:
  - mp4
  - webm
  - mov
  rename: safe
- name: downloads
  label: PDF 与下载文件
  input: assets/downloads
  output: /assets/downloads
  extensions:
  - pdf
  - zip
  - doc
  - docx
  - ppt
  - pptx
  rename: safe
- name: resumes
  label: 简历 PDF
  input: assets/resume
  output: /assets/resume
  extensions:
  - pdf
  rename: safe
settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: 新增 {name}（Pages CMS）
      update: 更新 {name}（Pages CMS）
      delete: 删除 {name}（Pages CMS）
      rename: 重命名 {oldPath} 为 {newPath}（Pages CMS）
components:
  site_settings:
    type: object
    label: 网站基本信息
    fields:
    - name: name
      label: 姓名
      type: string
      required: true
    - name: eyebrow
      label: 姓名上方小标题
      type: string
    - name: title
      label: 首页求职标题
      type: string
      required: true
    - name: subtitle
      label: 首页一句话方向
      type: text
    - name: intro
      label: 首页个人介绍
      type: text
    - name: email
      label: 邮箱
      type: string
    - name: github
      label: GitHub 链接
      type: string
    - name: linkedin
      label: LinkedIn 链接
      type: string
    - name: resumeUrl
      label: 简历 PDF
      type: file
      options:
        media: resumes
        extensions:
        - pdf
  label_value:
    type: object
    fields:
    - name: label
      label: 标签
      type: string
    - name: value
      label: 内容
      type: text
  title_text:
    type: object
    fields:
    - name: title
      label: 标题
      type: string
    - name: text
      label: 说明
      type: text
  link_item:
    type: object
    fields:
    - name: label
      label: 按钮文字
      type: string
    - name: url
      label: 链接
      type: string
  download_item:
    type: object
    fields:
    - name: label
      label: 下载按钮文字
      type: string
    - name: url
      label: 上传或选择文件
      type: file
      options:
        media: downloads
        extensions:
        - pdf
        - zip
        - doc
        - docx
        - ppt
        - pptx
  breakdown_media_item:
    type: object
    fields:
    - name: type
      label: 类型
      type: select
      required: true
      options:
        values:
        - name: image
          label: 图片／GIF
        - name: video
          label: 视频
    - name: src
      label: 图片／GIF
      type: image
      options:
        media: images
    - name: file
      label: 本地视频（可选）
      type: file
      options:
        media: videos
        extensions:
        - mp4
        - webm
        - mov
    - name: link
      label: YouTube／Bilibili 链接（可选）
      type: string
    - name: poster
      label: 视频封面（可选）
      type: image
      options:
        media: images
    - name: alt
      label: 媒体说明／替代文字（可选）
      type: string
    - name: note
      label: 媒体补充说明（可选）
      type: text
  breakdown_item:
    type: object
    fields:
    - name: label
      label: 小标题
      type: string
      required: true
    - name: text
      label: 说明
      type: text
    - name: media
      label: 配图／GIF／视频（可添加多个）
      component: breakdown_media_item
      list:
        collapsible:
          collapsed: true
          summary: '{type} · {alt}'
    - name: bullets
      label: 补充要点（可选）
      type: string
      list: true
  project:
    type: object
    fields:
    - name: id
      label: 项目 ID
      type: string
      required: true
      description: 只能用英文小写、数字和横杠；创建后尽量不要修改。
      pattern:
        regex: ^[a-z0-9-]+$
        message: 只能使用英文小写、数字和横杠。
    - name: order
      label: 显示顺序
      type: number
      required: true
    - name: featured
      label: 首页重点展示
      type: boolean
      default: false
    - name: library
      label: 在项目库显示
      type: boolean
      default: true
    - name: status
      label: 项目状态
      type: string
    - name: title
      label: 项目名称
      type: string
      required: true
    - name: category
      label: 项目分类
      type: string
    - name: role
      label: 我的职责
      type: text
    - name: summary
      label: 首页简短介绍
      type: text
    - name: tools
      label: 工具与技术
      type: text
    - name: tags
      label: 标签
      type: string
      list: true
    - name: coverImage
      label: 项目封面
      type: image
      options:
        media: images
    - name: videoLink
      label: 主视频普通链接
      type: string
    - name: videoEmbed
      label: 主视频嵌入链接（通常留空）
      type: string
    - name: videoFile
      label: 本地主视频（可选）
      type: file
      options:
        media: videos
        extensions:
        - mp4
        - webm
        - mov
    - name: videoPlatform
      label: 主视频平台
      type: select
      options:
        values:
        - YouTube
        - Bilibili
        - Local
    - name: externalLinks
      label: 外部链接按钮
      component: link_item
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
    - name: downloadLinks
      label: 下载文件
      component: download_item
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
    - name: detail
      label: 项目详情页
      type: object
      fields:
      - name: overview
        label: 项目概述
        type: text
      - name: whatIBuilt
        label: 我的具体工作
        type: text
        list: true
      - name: breakdown
        label: 系统／设计拆解
        component: breakdown_item
        list:
          collapsible:
            collapsed: true
            summary: '{label}'
      - name: challenges
        label: 关键挑战与复盘
        type: text
        list: true
      - name: workflowNotes
        label: 工作流程说明
        type: text
  game_history_settings:
    type: object
    label: ② Steam 导入与页面设置
    fields:
    - name: steamProfileUrl
      label: Steam 主页链接
      type: string
      description: 填写公开 Steam 主页。保存后，GitHub Actions 会通过 Steam Web API 首次导入一次并写入本地 JSON；之后网站只读取本地数据。
    - name: steamImportRequested
      label: 重新同步一次 Steam
      type: boolean
      default: false
      description: 平时不要勾。需要主动更新 Steam 游戏库时才勾选并保存；已有本地时长、状态、全成就和备注不会被覆盖。
    - name: highlightHours
      label: 自动重点展示时长阈值（小时）
      type: number
      default: 100
      description: 达到该时长、100% 全成就或手动重点的游戏会进入重点区。
    - name: featuredLimit
      label: 完整游戏经历页重点区最多显示
      type: number
      default: 18
    - name: homePreviewLimit
      label: 首页游戏经历小预览显示数量
      type: number
      default: 6
    - name: introZh
      label: 完整页原说明（旧字段，通常不用改）
      type: text
      description: 这是原有字段，仅作为新顶部字段留空时的完整页备用说明。你的“高投入 / 段位”文字请改最顶部带 ★ 的输入框。
    - name: introEn
      label: Original full-page intro (legacy fallback)
      type: text
      description: Legacy fallback only. Edit the starred field at the top for the shared homepage/full-page text.
    - name: steamNoteZh
      label: 中文 Steam 说明
      type: text
    - name: steamNoteEn
      label: English Steam note
      type: text
  manual_game_item:
    type: object
    label: 手动游戏
    fields:
    - name: name
      label: 游戏名称
      type: string
      required: true
      description: 中文名或英文名都可以；英文名以后可批量补全。
    - name: playtimeHours
      label: 游玩时长（小时）
      type: number
    - name: hideFromHome
      label: 不在首页重点游戏中显示
      type: boolean
      default: false
      description: 默认不要勾。未勾选时继续按原来的自动规则参与首页重点展示；只有勾选后才从首页重点区排除，不影响完整游戏经历页。
  steam_game_item:
    type: object
    label: Steam 已导入游戏
    fields:
    - name: name
      label: 游戏名称
      type: string
      required: true
    - name: nameZh
      label: 中文名称（可选）
      type: string
    - name: playtimeHours
      label: 游玩时长（小时，可修改）
      type: number
    - name: status
      label: 完成状态
      type: select
      options:
        values:
        - name: playing
          label: 持续游玩
        - name: completed
          label: 通关
        - name: multiple
          label: 多周目通关
        - name: main_complete
          label: 主线完成
        - name: sampled
          label: 试玩／短期体验
        - name: unfinished
          label: 未通关
    - name: playthroughs
      label: 通关／周目次数（可选）
      type: number
    - name: achievementsUnlocked
      label: 已解锁成就数（可选）
      type: number
    - name: achievementsTotal
      label: 总成就数（可选）
      type: number
    - name: perfect
      label: 100% 全成就
      type: boolean
      default: false
    - name: featured
      label: 手动重点展示
      type: boolean
      default: false
    - name: hideFromHome
      label: 不在首页重点游戏中显示
      type: boolean
      default: false
      description: 默认不要勾。未勾选时继续按原来的自动规则参与首页重点展示；只有勾选后才从首页重点区排除，不影响完整游戏经历页。
    - name: hidden
      label: 从网站隐藏／非游戏条目
      type: boolean
      default: false
      description: 也可以直接用列表右侧垃圾桶删除。删除后再次同步不会自动加回来。
    - name: genres
      label: 类型标签（可选）
      type: string
      list: true
    - name: designNoteZh
      label: 中文设计观察（可选）
      type: text
    - name: designNoteEn
      label: English design note (optional)
      type: text
    - name: steamAppId
      label: Steam App ID
      type: number
      description: 自动导入字段，通常不要修改。
content:
- name: portfolio_content
  label: 作品集内容
  type: group
  items:
  - name: portfolio_zh
    label: 中文网站内容
    type: file
    path: content/portfolio-zh.json
    format: json
    fields:
    - name: site
      label: 网站基本信息
      component: site_settings
    - name: snapshot
      label: 首页快速信息
      component: label_value
      list:
        collapsible:
          collapsed: true
          summary: '{label}: {value}'
    - name: focusAreas
      label: 首页主要能力
      component: title_text
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
    - name: resumeSkills
      label: 简历与技能区
      component: label_value
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
    - name: projects
      label: 项目（点击加号可新增）
      component: project
      list:
        collapsible:
          collapsed: true
          summary: '#{order} · {title}'
  - name: portfolio_en
    label: English Website Content
    type: file
    path: content/portfolio-en.json
    format: json
    fields:
    - name: site
      label: Site Settings
      component: site_settings
    - name: snapshot
      label: Quick Facts
      component: label_value
      list:
        collapsible:
          collapsed: true
          summary: '{label}: {value}'
    - name: focusAreas
      label: Main Skills
      component: title_text
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
    - name: resumeSkills
      label: Resume & Skills
      component: label_value
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
    - name: projects
      label: Projects
      component: project
      list:
        collapsible:
          collapsed: true
          summary: '#{order} · {title}'
  - name: game_history
    label: 游戏经历 / Games Played
    type: file
    path: content/game-history.json
    format: json
    fields:
    - name: homeGameIntroZh
      label: ★ 你要改的文字：首页“右侧展示我高投入…”（中文）
      type: text
      description: 这个输入框就在游戏经历编辑页最顶部、①手动添加游戏上方。你可以写 Apex 大师、炉石传说传说段位等一整段经历。保存后会同时替换首页游戏经历卡片的介绍文字，以及完整游戏经历页顶部介绍。留空则继续使用原来的默认文字。
    - name: homeGameIntroEn
      label: ★ Same game experience text (English, optional)
      type: text
      description: Optional English version. It appears in the same places when the site language is English. Leave blank to keep the existing English default.
    - name: manualGames
      label: ① 手动添加游戏（名字 + 时长；可单独取消首页展示）
      component: manual_game_item
      list:
        collapsible:
          collapsed: true
          summary: '{name} · {playtimeHours}h'
    - name: settings
      label: ② Steam 导入与页面设置
      component: game_history_settings
    - name: steamGames
      label: ③ Steam 已导入游戏（可改时长 / 状态 / 全成就 / 隐藏 / 删除）
      component: steam_game_item
      list:
        collapsible:
          collapsed: true
          summary: '{name} · {playtimeHours}h'
