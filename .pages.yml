media:
  - name: images
    label: 图片与蓝图
    input: assets/images
    output: /assets/images
    extensions: [png, jpg, jpeg, webp, gif]
    rename: safe
  - name: videos
    label: 本地短视频
    input: assets/videos
    output: /assets/videos
    extensions: [mp4, webm, mov]
    rename: safe
  - name: downloads
    label: PDF 与下载文件
    input: assets/downloads
    output: /assets/downloads
    extensions: [pdf, zip, doc, docx, ppt, pptx]
    rename: safe
  - name: resumes
    label: 简历 PDF
    input: assets/resume
    output: /assets/resume
    extensions: [pdf]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "新增 {name}（Pages CMS）"
      update: "更新 {name}（Pages CMS）"
      delete: "删除 {name}（Pages CMS）"
      rename: "重命名 {oldPath} 为 {newPath}（Pages CMS）"

components:
  site_settings:
    type: object
    label: 网站基本信息
    fields:
      - name: name
        label: 姓名
        type: string
        required: true
      - name: eyebrow
        label: 姓名上方小标题
        type: string
      - name: title
        label: 首页求职标题
        type: string
        required: true
      - name: subtitle
        label: 首页一句话方向
        type: text
      - name: intro
        label: 首页个人介绍
        type: text
      - name: email
        label: 邮箱
        type: string
      - name: github
        label: GitHub 链接
        type: string
      - name: linkedin
        label: LinkedIn 链接
        type: string
      - name: resumeUrl
        label: 简历 PDF
        type: file
        options:
          media: resumes
          extensions: [pdf]
      - name: demoReelEmbed
        label: 作品混剪嵌入链接
        type: string
        description: 可留空。填写 YouTube/Bilibili 播放器链接。
      - name: demoReelLink
        label: 作品混剪外部链接
        type: string
      - name: demoReelCoverImage
        label: 作品混剪封面
        type: image
        options:
          media: images
      - name: demoReelPlatform
        label: 视频平台
        type: select
        options:
          values: [YouTube, Bilibili, Local]

  label_value:
    type: object
    fields:
      - name: label
        label: 标签
        type: string
      - name: value
        label: 内容
        type: text

  title_text:
    type: object
    fields:
      - name: title
        label: 标题
        type: string
      - name: text
        label: 说明
        type: text

  link_item:
    type: object
    fields:
      - name: label
        label: 按钮文字
        type: string
      - name: url
        label: 链接
        type: string

  download_item:
    type: object
    fields:
      - name: label
        label: 下载按钮文字
        type: string
      - name: url
        label: 上传或选择文件
        type: file
        options:
          media: downloads
          extensions: [pdf, zip, doc, docx, ppt, pptx]

  breakdown_item:
    type: object
    fields:
      - name: label
        label: 小标题
        type: string
      - name: text
        label: 说明
        type: text

  blueprint_section:
    type: object
    fields:
      - name: title
        label: 板块标题
        type: string
        required: true
      - name: text
        label: 系统说明
        type: text
      - name: image
        label: 蓝图／流程图图片
        type: image
        options:
          media: images
      - name: imageAlt
        label: 图片替代文字
        type: string
      - name: imageLabel
        label: 未上传时的提示
        type: string
      - name: bullets
        label: 解释要点
        type: string
        list: true

  media_item:
    type: object
    fields:
      - name: type
        label: 媒体类型
        type: select
        required: true
        options:
          values:
            - name: image
              label: 图片
            - name: video
              label: 视频
            - name: placeholder
              label: 待补充占位
      - name: title
        label: 标题
        type: string
        required: true
      - name: note
        label: 说明
        type: text
      - name: src
        label: 图片
        type: image
        options:
          media: images
      - name: alt
        label: 图片替代文字
        type: string
      - name: link
        label: 视频外部链接
        type: string
        description: YouTube 或 Bilibili 普通视频链接。
      - name: embed
        label: 视频嵌入链接
        type: string
        description: 可留空，网站通常会根据普通视频链接自动生成。
      - name: poster
        label: 视频封面
        type: image
        options:
          media: images

  project:
    type: object
    fields:
      - name: id
        label: 项目 ID
        type: string
        required: true
        description: 只能用英文小写、数字和横杠；创建后尽量不要修改。
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "只能使用英文小写、数字和横杠。"
      - name: order
        label: 显示顺序
        type: number
        required: true
      - name: featured
        label: 首页重点展示
        type: boolean
        default: false
      - name: library
        label: 在项目库显示
        type: boolean
        default: true
      - name: status
        label: 项目状态
        type: string
        description: 例如：已完成、开发中、已停止开发、素材待补充。
      - name: title
        label: 项目名称
        type: string
        required: true
      - name: category
        label: 项目分类
        type: string
      - name: role
        label: 我的职责
        type: text
      - name: summary
        label: 首页简短介绍
        type: text
      - name: tools
        label: 工具与技术
        type: text
      - name: tags
        label: 标签
        type: string
        list: true
      - name: coverImage
        label: 项目封面
        type: image
        options:
          media: images
      - name: videoLink
        label: 主视频普通链接
        type: string
        description: 填 YouTube 或 Bilibili 普通链接。
      - name: videoEmbed
        label: 主视频嵌入链接
        type: string
        description: 可留空；普通链接能识别时网站会自动转换。
      - name: videoFile
        label: 本地短视频
        type: file
        options:
          media: videos
          extensions: [mp4, webm, mov]
      - name: videoPlatform
        label: 主视频平台
        type: select
        options:
          values: [YouTube, Bilibili, Local]
      - name: externalLinks
        label: 外部链接按钮
        component: link_item
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
      - name: downloadLinks
        label: 下载文件
        component: download_item
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
      - name: detail
        label: 项目详情页
        type: object
        fields:
          - name: overview
            label: 项目概述
            type: text
          - name: whatIBuilt
            label: 我的具体工作
            type: text
            list: true
          - name: breakdown
            label: 系统／设计拆解
            component: breakdown_item
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
          - name: challenges
            label: 问题与改进
            type: text
            list: true
          - name: workflowNotes
            label: 工作流程说明
            type: text
      - name: mediaGallery
        label: 多媒体画廊
        component: media_item
        list:
          collapsible:
            collapsed: true
            summary: "{title} · {type}"
      - name: blueprintSections
        label: 蓝图／系统拆解页面
        component: blueprint_section
        list:
          collapsible:
            collapsed: true
            summary: "{title}"

content:
  - name: portfolio_content
    label: 作品集内容
    type: group
    items:
      - name: portfolio_zh
        label: 中文网站内容
        type: file
        path: content/portfolio-zh.json
        format: json
        fields:
          - name: site
            label: 网站基本信息
            component: site_settings
          - name: snapshot
            label: 首页快速信息
            component: label_value
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {value}"
          - name: focusAreas
            label: 首页主要能力
            component: title_text
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
          - name: resumeSkills
            label: 简历与技能区
            component: label_value
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
          - name: projects
            label: 项目（点击加号可新增）
            component: project
            list:
              collapsible:
                collapsed: true
                summary: "#{order} · {title}"
      - name: portfolio_en
        label: English Website Content
        type: file
        path: content/portfolio-en.json
        format: json
        fields:
          - name: site
            label: Site Settings
            component: site_settings
          - name: snapshot
            label: Quick Facts
            component: label_value
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {value}"
          - name: focusAreas
            label: Main Capabilities
            component: title_text
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
          - name: resumeSkills
            label: Skills Section
            component: label_value
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
          - name: projects
            label: Projects (use + to add)
            component: project
            list:
              collapsible:
                collapsed: true
                summary: "#{order} · {title}"
