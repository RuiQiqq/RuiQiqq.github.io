name: Import Steam Games

on:
  push:
    paths:
      - "content/game-history.json"
      - "scripts/import_steam_games.py"
      - ".github/workflows/import-steam-games.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Force one Steam refresh (keeps local edits)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Import Steam library to local JSON snapshot
        env:
          FORCE_STEAM_IMPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: python scripts/import_steam_games.py

      - name: Commit local snapshot changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/game-history.json content/steam-import-state.json
          git commit -m "Update local Steam game history snapshot"
          git push
