name: Import Steam Games

on:
  push:
    paths:
      - "content/game-history.json"
      - "scripts/import_steam_games.py"
      - ".github/workflows/import-steam-games.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a one-time Steam refresh (keeps local edits)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove obsolete legacy helper files
        shell: bash
        run: |
          rm -rf PREVIEW
          rm -f \
            EDIT-ME-Chinese.js \
            EDIT-ME-English.js \
            GAME-HISTORY-IMPORT-说明.txt \
            'PAGES-CMS-CONFIG-#U53ef#U590d#U5236.txt' \
            'PAGES-CMS-CONFIG-可复制.txt' \
            assets/downloads/PUT-DOWNLOADABLE-FILES-HERE.txt \
            assets/images/PUT-PROJECT-IMAGES-HERE.txt \
            assets/images/PUT_PROJECT_IMAGES_HERE.txt \
            'assets/resume/#U8bf7#U628a#U4e2d#U6587#U7b80#U5386#U653e#U5728#U8fd9#U91cc.txt' \
            assets/resume/PUT-ENGLISH-RESUME-HERE.txt \
            assets/resume/PUT-YOUR-RESUME-PDF-HERE.txt \
            assets/resume/PUT_RESUME_PDF_HERE.txt \
            assets/videos/PUT-LOCAL-VIDEOS-HERE.txt

      - name: Import public Steam library to local JSON snapshot
        id: steam_import
        continue-on-error: true
        env:
          FORCE_STEAM_IMPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: python scripts/import_steam_games.py

      - name: Commit cleanup and imported snapshot
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update game history snapshot and clean legacy helpers"
          git push

      - name: Report Steam import failure
        if: steps.steam_import.outcome == 'failure'
        run: |
          echo "Steam import failed. Repository cleanup/config updates were still preserved."
          exit 1
